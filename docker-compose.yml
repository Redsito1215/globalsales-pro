# GLOBTRADE S.A. — C:\proyect6softwa
# Un solo compose: app + (opcional) Airflow ETL
#
# Solo app:
#   docker compose up -d --build
#
# App + Airflow (ETL estratégico / informes RC):
#   docker compose --profile airflow up -d --build
#
# Web :5001 | API :8001 | Mongo :27017 | ClickHouse :8123 | Airflow UI :8080

name: globtrade-saas

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.12
  profiles: ["airflow"]
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    _PIP_ADDITIONAL_REQUIREMENTS: pymongo>=4.6 clickhouse-connect>=0.8.15 pandas>=2.0 pyarrow>=14 pydantic-settings>=2.0 python-dotenv>=1.0
    GLOBTRADE_PROJECT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project:/opt/airflow/project/backend
    MONGO_URI: mongodb://mongo:27017
    MONGO_DB: globtrade_dw
    MONGO_OPS_DB: globtrade_ops
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_DATABASE: globtrade_analytics
    CSV_SOURCE: /opt/airflow/project/data/sales.csv
    POCKETBASE_COLLECTION: sales_records
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./etl_proceso:/opt/airflow/project/etl_proceso
    - ./backend:/opt/airflow/project/backend
    - ./paquetes:/opt/airflow/project/paquetes
    - ./data:/opt/airflow/project/data
    - ./frontend/static/uploads:/opt/airflow/project/frontend/static/uploads
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    mongo:
      condition: service_healthy
    airflow-postgres:
      condition: service_healthy
    clickhouse:
      condition: service_healthy

services:
  mongo:
    image: mongo:7
    container_name: globtrade-saas-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: globtrade-saas-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: globtrade_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: globtrade-saas-api
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    environment:
      PYTHONPATH: /app/backend:/app
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: globtrade_dw
      MONGO_OPS_DB: ${MONGO_OPS_DB:-globtrade_ops}
      MONGO_REPLICA_URI: ${MONGO_REPLICA_URI:-}
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET:-}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: globtrade_analytics
      API_PORT: "8000"
      CSV_SOURCE: /app/data/sales.csv
    volumes:
      - ./data:/app/data
      - ./backend/auth:/app/backend/auth:ro
      - ./backend/config:/app/backend/config:ro
      - ./backend/etl:/app/backend/etl:ro
      - ./backend/shared:/app/backend/shared:ro
      - ./paquetes:/app/paquetes:ro
    depends_on:
      mongo:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  web:
    build: .
    container_name: globtrade-saas-web
    restart: unless-stopped
    command: >
      sh -c "find /app/paquetes -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null;
      python frontend/app.py"
    ports:
      - "5001:5000"
    environment:
      PYTHONPATH: /app/backend:/app
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: globtrade_dw
      MONGO_OPS_DB: ${MONGO_OPS_DB:-globtrade_ops}
      MONGO_REPLICA_URI: ${MONGO_REPLICA_URI:-}
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET:-}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: globtrade_analytics
      WEB_PORT: "5000"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-globtrade-docker-change-me}
      FLASK_DEBUG: "1"
    volumes:
      - ./data:/app/data
      - ./frontend/app.py:/app/frontend/app.py:ro
      - ./frontend/static:/app/frontend/static
      - ./paquetes:/app/paquetes:ro
      - ./backend/auth:/app/backend/auth:ro
      - ./backend/config:/app/backend/config:ro
      - ./backend/shared:/app/backend/shared:ro
      - ./backend/etl:/app/backend/etl:ro
    depends_on:
      mongo:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  etl-mongo:
    build: .
    profiles: ["etl-mongo"]
    container_name: globtrade-saas-etl
    command: python -m etl.run_pipeline_mongo
    environment:
      PYTHONPATH: /app/backend
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: globtrade_dw
      CSV_SOURCE: /app/data/sales.csv
      POCKETBASE_COLLECTION: sales_records
    volumes:
      - ./data:/app/data
    depends_on:
      mongo:
        condition: service_healthy

  # ── Airflow (profile: airflow) — ETL estratégico para RC / Tablero ──
  airflow-postgres:
    image: postgres:15
    profiles: ["airflow"]
    container_name: globtrade-saas-airflow-pg
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: globtrade-saas-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname Glob \
          --lastname Trade \
          --role Admin \
          --email admin@globtrade.local || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    user: "0:0"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: globtrade-saas-airflow-web
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 90s
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: globtrade-saas-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  mongo_data:
    external: true
    name: globtrade_mongo_data
  airflow_pgdata:
    name: globtrade_airflow_pgdata
  clickhouse_data:
    name: globtrade_clickhouse_data
